<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问卷后台 · 数据看板</title>
<style>
  :root{--green:#2e7d32;--green-dark:#1b5e20;--green-light:#e8f5e9;--text:#263238;--muted:#78909c;--line:#dfe6e9;--danger:#c62828;--amber:#ef6c00;--bg:#f4f7f5}
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(120deg,#1b5e20,#2e7d32 55%,#388e3c);color:#fff;padding:18px 16px}
  .wrap{max-width:960px;margin:0 auto}
  h1{font-size:19px;margin:0}
  .sub{font-size:12.5px;opacity:.9;margin-top:4px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 16px}
  .btn{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-size:14px;background:#fff;border:1px solid var(--line);color:var(--text)}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.danger{background:#fff;color:var(--danger);border-color:var(--danger)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 16px}
  .card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card .v{font-size:28px;font-weight:800;color:var(--green-dark)}
  .card .k{font-size:13px;color:var(--muted);margin-top:2px}
  .panel{background:#fff;border-radius:10px;padding:18px 16px;margin:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .panel h2{font-size:15px;margin:0 0 12px;color:var(--green-dark)}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .bar-label{width:150px;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .bar-track{flex:1;background:#f0f3f3;border-radius:6px;height:20px;overflow:hidden;position:relative}
  .bar-fill{height:100%;background:linear-gradient(90deg,#66bb6a,#43a047);border-radius:6px}
  .bar-val{width:96px;font-size:12.5px;color:var(--text);white-space:nowrap;flex-shrink:0}
  .vline-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding:10px 4px 0;border-bottom:1px solid var(--line)}
  .vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .vcol .bar{width:100%;background:linear-gradient(180deg,#43a047,#2e7d32);border-radius:4px 4px 0 0;min-height:2px}
  .vcol .num{font-size:11px;color:var(--text);margin-bottom:2px}
  .vcol .day{font-size:10px;color:var(--muted);margin-top:4px;transform:rotate(-30deg);transform-origin:center;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;background:#fafbfb}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px}
  .badge.ok{background:var(--green-light);color:var(--green-dark)}
  .badge.no{background:#fdecea;color:var(--danger)}
  tr.invalid td{background:#fff7f6}
  .empty{color:var(--muted);text-align:center;padding:30px 0}
  /* 登录遮罩 */
  .login-mask{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200}
  .login-box{background:#fff;border-radius:14px;padding:30px 24px;width:320px;box-shadow:0 6px 24px rgba(0,0,0,.12);text-align:center}
  .login-box h2{margin:0 0 6px;color:var(--green-dark)}
  .login-box p{font-size:12.5px;color:var(--muted);margin:0 0 16px}
  .login-box input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center;margin-bottom:12px}
  .qr-note{font-size:12px;color:var(--muted);margin-top:8px}
  .linkbox{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .linkbox input{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .flex{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .muted{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>问卷后台 · 数据看板</h1>
      <div class="sub">绿色社会工作视角下高校群体环境意识与绿色实践参与调查</div>
    </div>
  </header>

  <div class="login-mask" id="loginMask">
    <div class="login-box">
      <h2>后台登录</h2>
      <p>请输入后台访问口令（部署时设置于 server.js 的 ADMIN_KEY）</p>
      <input type="password" id="keyInput" placeholder="访问口令">
      <div style="margin-bottom:12px;text-align:left"><span class="muted" id="loginErr" style="color:#c62828"></span></div>
      <button class="btn primary" style="width:100%" id="loginBtn">进入看板</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn primary" id="refreshBtn">刷新数据</button>
    <span class="muted" id="lastUpdate">尚未加载</span>
    <span style="flex:1"></span>
    <label class="muted">筛选：</label>
    <button class="btn" id="fAll">全部</button>
    <button class="btn" id="fValid">有效</button>
    <button class="btn" id="fInvalid">无效</button>
  </div>

  <div class="stat-cards" id="statCards"></div>

  <div class="panel">
    <h2>提交时间线</h2>
    <div id="timeline"></div>
  </div>

  <div class="panel">
    <h2>样本构成</h2>
    <div id="demo"></div>
  </div>

  <div class="panel">
    <h2>各量表维度平均分（1—5 分）</h2>
    <div id="likert"></div>
  </div>

  <div class="panel">
    <h2>答卷明细（含质检标识）</h2>
    <div class="flex" style="margin-bottom:10px">
      <button class="btn primary" id="exportBtn">导出 CSV（Excel 可打开）</button>
      <button class="btn" id="exportJson">导出 JSON</button>
      <span class="muted" id="tableInfo"></span>
    </div>
    <div style="overflow-x:auto"><table id="detailTable"></table></div>
  </div>

  <div class="panel">
    <h2>问卷链接与二维码</h2>
    <p class="muted" style="margin:0 0 8px">将此链接/二维码发给被调查人即可填写。问卷地址会随你的部署地址自动变化。</p>
    <div class="linkbox">
      <input type="text" id="surveyUrl" readonly>
      <button class="btn" id="copyBtn">复制链接</button>
      <button class="btn primary" id="qrBtn">生成二维码</button>
    </div>
    <div id="qrWrap" style="margin-top:12px;text-align:center"></div>
    <p class="qr-note" id="qrNote"></p>
  </div>

<script>
/* ============ 配置（与问卷题目对应，用于图表标注） ============ */
var KEY = '';
var DATA = [];
var FILTER = 'all';

var DEMO_OPTS = {
  identity:{retired_staff:'退役军人（在职/社会）',retired_student:'退役大学生（在读）',general_student:'一般大学生',teacher:'教职工'},
  gender:{'男':'男','女':'女'},
  age:{'18-25':'18—25 岁','26-35':'26—35 岁','36-45':'36—45 岁','46+':'46 岁及以上'},
  grade:{'大一':'大一','大二':'大二','大三':'大三','大四':'大四','研究生':'研究生','博士生':'博士生'},
  discipline:{'人文社科':'人文社科','理工农医':'理工农医','艺术体育':'艺术体育','其他':'其他'},
  politics:{'党员':'中共党员（含预备）','团员':'共青团员','群众':'群众','其他':'其他'},
  awareness:{'了解':'非常了解','听说':'听说过','不了解':'不了解'},
  participate:{'经常':'经常参加','偶尔':'偶尔参加','了解未参加':'仅了解未参加','从未':'从未接触'},
  frequency:{'m1':'每月1次及以上','q1':'每季度1—2次','s1':'每学期1—2次','y1':'每年1次或更少'}
};

var LIK = [
  {label:'环境认知与态度', items:[['cog1','人与自然相互依赖'],['cog2','破坏自然损害人类福祉'],['cog3','人类有权大规模开发自然',true],['cog4','经济与环保可协调推进'],['cog5','关注全球性环境问题'],['cog6','环境恶化伤害弱势群体'],['cog7','环境问题是公平/正义问题'],['cog8','优先保障弱势群体环境权益']]},
  {label:'亲环境行为', items:[['b1','节约水电资源'],['b2','垃圾分类投放'],['b3','减少一次性用品'],['b4','绿色出行'],['b5','参加生态志愿活动'],['b6','关注转发环保内容'],['b7','宣传环保理念'],['b8','愿意参与绿色公益']]},
  {label:'绿色志愿服务参与', items:[['v1','知道巡河护河活动'],['v2','知道古树保护行动'],['v3','退役军人示范带动作用'],['v4','愿意参与绿色活动']]},
  {label:'绿色社工认知与期望', items:[['g1','了解绿色社会工作'],['g2','社工可介入环保'],['g3','社工志愿者角色认知'],['g4','学生社团作用'],['g5','希望提供培训'],['g6','绿色融入校园文化'],['g7','模式值得推广']]}
];

/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function demoLabel(name, v){
  var m = DEMO_OPTS[name];
  return m && m[v] ? m[v] : (v==null?'（未填）':v);
}

/* ============ 登录 ============ */
function tryLogin(){
  var k = $('keyInput').value.trim();
  if(!k){ $('loginErr').textContent='请输入口令'; return; }
  fetch('/api/records?key='+encodeURIComponent(k))
    .then(function(r){
      if(r.status===401){ $('loginErr').textContent='口令错误，请重试'; return null; }
      if(!r.ok){ throw new Error('err'); }
      KEY = k;
      sessionStorage.setItem('survey_key', k);
      $('loginMask').style.display='none';
      load();
      return null;
    })
    .catch(function(){ $('loginErr').textContent='加载失败，请检查服务是否正常'; });
}
$('loginBtn').addEventListener('click', tryLogin);
$('keyInput').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });
window.addEventListener('load', function(){
  var saved = sessionStorage.getItem('survey_key');
  if(saved){ KEY = saved; $('loginMask').style.display='none'; load(); }
  // 问卷链接
  $('surveyUrl').value = location.origin + '/';
});

/* ============ 加载 ============ */
function load(){
  $('refreshBtn').disabled = true;
  fetch('/api/records?key='+encodeURIComponent(KEY))
    .then(function(r){ return r.json(); })
    .then(function(rows){
      DATA = rows || [];
      $('refreshBtn').disabled = false;
      $('lastUpdate').textContent = '上次刷新：' + new Date().toLocaleTimeString() + '（共 ' + DATA.length + ' 份）';
      render();
    })
    .catch(function(){ $('refreshBtn').disabled = false; $('lastUpdate').textContent='加载失败'; });
}
$('refreshBtn').addEventListener('click', load);

/* ============ 筛选 ============ */
function filtered(){
  if(FILTER==='valid') return DATA.filter(function(r){return r.checkPass;});
  if(FILTER==='invalid') return DATA.filter(function(r){return !r.checkPass;});
  return DATA;
}
function setFilter(f){
  FILTER = f;
  ['fAll','fValid','fInvalid'].forEach(function(id){ $(id).style.background = (id===f)?'#2e7d32':''; $(id).style.color = (id===f)?'#fff':''; });
  render();
}
$('fAll').addEventListener('click', function(){setFilter('fAll');});
$('fValid').addEventListener('click', function(){setFilter('fValid');});
$('fInvalid').addEventListener('click', function(){setFilter('fInvalid');});

/* ============ 渲染 ============ */
function render(){
  var valid = DATA.filter(function(r){return r.checkPass;}).length;
  var invalid = DATA.length - valid;
  var rate = DATA.length ? (valid/DATA.length*100).toFixed(1) : '0';
  $('statCards').innerHTML =
    card(DATA.length,'答卷总数','') +
    card(valid,'有效答卷','算术题答对') +
    card(invalid,'无效答卷','算术题答错') +
    card(rate+'%','有效率','');

  renderTimeline();
  renderDemo();
  renderLikert();
  renderTable();
}

function card(v,k,hint){
  return '<div class="card"><div class="v">'+esc(v)+'</div><div class="k">'+esc(k)+(hint?' · '+esc(hint):'')+'</div></div>';
}

function renderTimeline(){
  var by = {};
  DATA.forEach(function(r){
    var d = (r.submittedAt||'').slice(0,10);
    if(!d) d='未知';
    by[d]=(by[d]||0)+1;
  });
  var keys = Object.keys(by).sort();
  var el = $('timeline');
  if(!keys.length){ el.innerHTML='<div class="empty">暂无数据</div>'; return; }
  var max = Math.max.apply(null, keys.map(function(k){return by[k];}));
  var html = '<div class="vline-chart">';
  keys.forEach(function(k){
    var h = Math.round(by[k]/max*130);
    html += '<div class="vcol"><div class="num">'+by[k]+'</div><div class="bar" style="height:'+(h||2)+'px"></div><div class="day">'+k.slice(5)+'</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderDemo(){
  var fields = ['identity','gender','age','discipline','politics'];
  var html = '';
  fields.forEach(function(name){
    var cnt = {};
    DATA.forEach(function(r){
      var d = r.demo || {};
      var v = d[name];
      var lab = demoLabel(name, v);
      cnt[lab] = (cnt[lab]||0)+1;
    });
    var total = DATA.length || 1;
    html += '<div style="margin:12px 0"><div class="muted" style="margin-bottom:4px">'+labName(name)+'</div>';
    Object.keys(cnt).forEach(function(k){
      var c = cnt[k];
      var pct = Math.round(c/total*100);
      html += barRow(k, c, pct, maxOf(cnt));
    });
    html += '</div>';
  });
  $('demo').innerHTML = html;
}

function labName(n){
  return {identity:'身份类型',gender:'性别',age:'年龄段',discipline:'学科背景',politics:'政治面貌'}[n]||n;
}
function maxOf(obj){ var m=1; Object.keys(obj).forEach(function(k){ if(obj[k]>m)m=obj[k]; }); return m; }
function barRow(label, count, pct, max){
  var w = max>0 ? Math.round(count/max*100) : 0;
  return '<div class="bar-row"><div class="bar-label" title="'+esc(label)+'">'+esc(label)+'</div>'
    + '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'
    + '<div class="bar-val">'+count+' 人（'+pct+'%）</div></div>';
}

function renderLikert(){
  var html = '';
  LIK.forEach(function(g){
    // 计算每项均值
    var rows = [];
    g.items.forEach(function(item){
      var code = item[0];
      var rev = !!item[2];
      var sum=0,n=0;
      DATA.forEach(function(r){
        var v = r.likert && r.likert[code];
        if(typeof v==='number'){
          if(rev) v = 6 - v;
          sum += v; n++;
        }
      });
      var mean = n ? (sum/n).toFixed(2) : '—';
      rows.push([item[1], item[2], parseFloat(mean), n]);
    });
    html += '<div style="margin:16px 0"><div class="muted" style="margin-bottom:6px;font-weight:600;color:#2e7d32">'+g.label+'</div>';
    rows.forEach(function(row){
      var label = row[0], reverse = row[1], mean = row[2], n = row[3];
      var w = isNaN(mean) ? 0 : Math.round((mean-1)/4*100);
      html += '<div class="bar-row"><div class="bar-label" title="'+esc(label)+(reverse?'（反向计分）':'')+'">'+esc(label)+(reverse?' *':'')+'</div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'
        + '<div class="bar-val">'+ (isNaN(mean)?'—':mean) +'（n='+n+'）</div></div>';
    });
    html += '</div>';
  });
  $('likert').innerHTML = html || '<div class="empty">暂无数据</div>';
}

function renderTable(){
  var rows = filtered();
  var el = $('detailTable');
  $('tableInfo').textContent = '当前显示 ' + rows.length + ' 份（按提交时间倒序）';
  if(!rows.length){ el.innerHTML='<tr><td class="empty">暂无数据</td></tr>'; return; }
  var sorted = rows.slice().sort(function(a,b){ return (b.submittedAt||'') > (a.submittedAt||'') ? 1 : -1; });
  var html = '<thead><tr><th>时间</th><th>身份</th><th>年龄</th><th>性别</th><th>质检</th><th>建议</th></tr></thead><tbody>';
  sorted.slice(0,50).forEach(function(r){
    var d = r.demo||{};
    var cls = r.checkPass ? '' : ' class="invalid"';
    var badge = r.checkPass ? '<span class="badge ok">有效</span>' : '<span class="badge no">无效</span>';
    var open = (r.open||'').slice(0,30);
    html += '<tr'+cls+'><td style="white-space:nowrap">'+esc((r.submittedAt||'').slice(0,16).replace('T',' '))+'</td>'
      + '<td>'+esc(demoLabel('identity', d.identity))+'</td>'
      + '<td>'+esc(demoLabel('age', d.age))+'</td>'
      + '<td>'+esc(d.gender||'')+'</td>'
      + '<td>'+badge+'</td>'
      + '<td>'+(open ? esc(open)+'…' : '—')+'</td></tr>';
  });
  html += '</tbody>';
  el.innerHTML = html;
}

/* ============ 导出 CSV / JSON ============ */
function flatColumns(){
  var cols = [
    ['id','编号'],['submittedAt','提交时间'],['checkPass','质检结果'],
    ['demo.identity','身份类型'],['demo.gender','性别'],['demo.age','年龄段'],['demo.grade','年级'],
    ['demo.discipline','学科背景'],['demo.politics','政治面貌'],['demo.awareness','知晓度'],['demo.participate','参与情况'],['demo.frequency','活动频次']
  ];
  // 五级量表
  LIK.forEach(function(g){
    g.items.forEach(function(item){
      cols.push(['likert.'+item[0], item[1]]);
    });
  });
  cols.push(['multi.motivation','参与动机（多选）']);
  cols.push(['multi.obstacle','参与障碍（多选）']);
  cols.push(['likert.r1','军旅经历增强环保责任感']);
  cols.push(['likert.r2','绿色志愿帮助适应/归属感']);
  cols.push(['likert.r3','以老兵身份朋辈引领']);
  cols.push(['likert.t1','愿意提供专业技术指导']);
  cols.push(['likert.t2','绿色实践与学科结合']);
  cols.push(['open','意见建议']);
  cols.push(['check.a','算术题a'],['check.b','算术题b'],['check.ans','算术题答案']);
  return cols;
}
function getPath(r, path){
  var parts = path.split('.');
  var cur = r;
  for(var i=0;i<parts.length;i++){ if(cur==null) return null; cur = cur[parts[i]]; }
  return cur;
}
function csvVal(v){
  if(v==null) return '';
  if(Array.isArray(v)) v = v.join('；');
  v = String(v);
  if(v.indexOf(',')>-1 || v.indexOf('"')>-1 || v.indexOf('\n')>-1){
    v = '"' + v.replace(/"/g,'""') + '"';
  }
  return v;
}
function buildCsv(){
  var cols = flatColumns();
  var lines = [];
  lines.push(cols.map(function(c){ return c[1]; }).join(','));
  DATA.forEach(function(r){
    var cells = cols.map(function(c){
      var p = c[0];
      var v;
      if(p==='checkPass') v = r.checkPass ? '有效' : '无效';
      else if(p.indexOf('multi.')===0) v = (r.multi||{})[p.split('.')[1]] || [];
      else v = getPath(r, p);
      return csvVal(v);
    });
    lines.push(cells.join(','));
  });
  return '\uFEFF' + lines.join('\r\n');
}
function download(name, content, type){
  var blob = new Blob([content], {type: type||'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 200);
}
$('exportBtn').addEventListener('click', function(){
  var d = new Date();
  var fname = '问卷数据_' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2) + '_' + ('0'+d.getHours()).slice(-2) + ('0'+d.getMinutes()).slice(-2) + '.csv';
  download(fname, buildCsv(), 'text/csv;charset=utf-8');
});
$('exportJson').addEventListener('click', function(){
  download('问卷数据_raw.json', JSON.stringify(DATA, null, 2), 'application/json');
});

/* ============ 链接 / 二维码 ============ */
$('copyBtn').addEventListener('click', function(){
  var inp = $('surveyUrl');
  inp.select(); inp.setSelectionRange(0,99999);
  navigator.clipboard.writeText(inp.value).then(function(){ $('qrNote').textContent='链接已复制'; });
});
$('qrBtn').addEventListener('click', function(){
  var url = $('surveyUrl').value;
  if(!url){ $('qrNote').textContent='请先填写问卷链接'; return; }
  var wrap = $('qrWrap');
  wrap.innerHTML = '<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url) + '" alt="二维码" onerror="this.style.display=\'none\';document.getElementById(\'qrNote\').textContent=\'二维码在线生成服务不可用，请直接复制链接使用\'">';
  $('qrNote').textContent = '右键二维码图片可另存为图片；也可复制链接自行在任意二维码工具中生成。';
});
</script>
</body>
</html>
